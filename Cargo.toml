[package]
name = "disk-indexer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A conservative local multi-volume content indexer"
license = "MIT"

[lib]
name = "disk_indexer"
path = "src/lib.rs"

[[bin]]
name = "disk-indexer"
path = "src/main.rs"

[[bin]]
name = "disk-indexer-benchmark"
path = "src/bin/benchmark.rs"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
ctrlc = "3.4"
directories = "6.0"
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.16", features = ["v4", "serde"] }
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.15"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
